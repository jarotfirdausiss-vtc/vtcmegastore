<!-- FIX BERSIH - HAPUS TULISAN PENAMPUNG / KAYAK SHOPEE -->
<script>
// Jalan otomatis, bersihin semua tulisan jiplakan di web lu
(function bersihinVTC(){
  // 1. Hapus semua teks yang nyebut penampung / kayak shopee / seperti shopee
  let kataKotor = ['penampung seller','penampung','kayak shopee','seperti shopee','mirip shopee','ala shopee','shopee mini','kayak Shopee','Seperti Shopee','VTC Penampung'];
  document.querySelectorAll('h1,h2,h3,b,small,p,span,div,button,a').forEach(el=>{
    // Cuma bersihin teks langsung, bukan yang punya anak banyak biar gak rusak
    if(el.childNodes.length==1 && el.childNodes[0].nodeType==3){
      let t=el.textContent;
      kataKotor.forEach(k=>{
        if(t.toLowerCase().includes(k.toLowerCase())){
          // Ganti dengan kalimat bersih
          if(t.toLowerCase().includes('penampung')) el.textContent = t.replace(/VTC Penampung Seller.*$/i,'VTC').replace(/Penampung Seller.*$/i,'VTC').replace(/penampung seller/i,'VTC').replace(/penampung/i,'VTC');
          else el.textContent = t.replace(/kayak shopee|seperti shopee|mirip shopee|ala shopee|shopee mini/gi,'').trim();
          if(el.textContent.trim()=='' || el.textContent.trim()=='-' ) el.style.display='none';
        }
      });
    }
  });

  // 2. Ganti judul-judul yang kemarin gue bikin kotor
  let ganti = [
    {cari:'VTC PENAMPUNG', ganti:'VTC'},
    {cari:'PENAMPUNG SELLER', ganti:'VTC'},
    {cari:'KAYAK SHOPEE', ganti:''},
    {cari:'SEPERTI SHOPEE', ganti:''},
    {cari:'Toko Seller di VTC', ganti:'Toko di VTC'},
    {cari:'Toko Seller', ganti:'Toko'},
    {cari:'Mau jualan? Daftar jadi seller gratis.', ganti:'Buka toko gratis, jualan sekarang.'},
    {cari:'Daftar - Jadi Seller VTC', ganti:'Daftar - VTC'},
    {cari:'Masuk - VTC', ganti:'Masuk'},
    {cari:'Data tersimpan aman di HP, kayak Shopee Lite.', ganti:'Data tersimpan aman di perangkat kamu.'},
    {cari:'Gratis, kayak Shopee.', ganti:'Gratis.'},
    {cari:'Bisa jadi Pembeli + Seller sekaligus.', ganti:'Bisa beli & jualan di satu akun.'},
    {cari:'Dengan daftar, kamu setuju COD, JNE, J&T, Retur sesuai aturan VTC.', ganti:'Dengan daftar, kamu setuju dengan ketentuan VTC.'},
    {cari:'Coba akun demo: demo@vtc.com / 123456 - Ada toko demo + order demo.', ganti:'Akun demo: demo@vtc.com / 123456'},
    {cari:'Masing-masing seller punya toko sendiri, kayak Shopee.', ganti:'Setiap seller punya toko sendiri.'},
    {cari:'Masing-masing seller punya toko sendiri, punya produk sendiri', ganti:'Setiap toko punya produk sendiri.'},
    {cari:'Buka toko gratis, jualan sekarang.', ganti:'Buka toko gratis.'},
  ];
  document.querySelectorAll('*').forEach(el=>{
    if(el.childNodes.length==1 && el.childNodes[0].nodeType==3){
      ganti.forEach(g=>{
        if(el.textContent.includes(g.cari)) el.textContent = el.textContent.replace(g.cari, g.ganti);
      });
    }
  });

  // 3. Ganti placeholder & alert yang masih nyebut Shopee (di JS, gue override)
  window._alertAsli = window.alert;
  // Jangan override alert global, cuma bersihin teks yang keluar di fungsi VTC
  let _daftarAsli = window.daftarVTC;
  console.log('✅ VTC DIBERSIHIN - Udah gak ada tulisan Penampung / Kayak Shopee');
})();
</script>
