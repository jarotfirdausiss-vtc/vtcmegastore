<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VTC - Beli & Jualan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0A;color:#fff;font-family:Arial,sans-serif;padding-bottom:100px}
.top{position:sticky;top:0;background:#0A0A0A;padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #262626;z-index:99}
.logo{font-size:26px;font-weight:900}.logo i{color:#FF6B00;font-style:normal}
.search{display:flex;gap:8px;padding:12px 14px}
.search input{flex:1;background:#1A1A1A;border:1px solid #333;color:#fff;padding:12px;border-radius:999px}
.search button{background:#FF6B00;color:#fff;border:none;padding:12px 18px;border-radius:999px;font-weight:800}
.card{background:#161616;border:1px solid #262626;border-radius:20px;padding:14px;margin:10px 14px}
.inp{width:100%;background:#1A1A1A;border:1px solid #333;color:#fff;padding:12px;border-radius:12px;margin-bottom:8px}
.btn{width:100%;background:#FF6B00;color:#fff;border:none;padding:13px;border-radius:12px;font-weight:900}
.btn2{width:100%;background:#222;color:#fff;border:1px solid #333;padding:12px;border-radius:12px;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:8px 14px}
.p{background:#1E1E1E;border-radius:16px;padding:10px;text-align:center;cursor:pointer}
.p img{width:100%;height:80px;object-fit:cover;border-radius:12px}
.p b{font-size:12px;display:block;height:30px;overflow:hidden}
.p .h{color:#FF6B00;font-weight:900}
.nav{position:fixed;left:12px;right:12px;bottom:12px;background:#141414;border:1px solid #333;border-radius:24px;display:flex;justify-content:space-around;padding:12px 6px;z-index:999}
.nav a{font-size:11px;color:#888;text-align:center;text-decoration:none}
.nav .plus{background:#FF6B00;color:#fff!important;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-top:-30px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}.box{background:#161616;border-radius:20px;padding:16px;width:100%;max-width:380px}
.chip{display:inline-block;padding:7px 12px;border-radius:999px;background:#222;border:1px solid #333;font-size:12px;margin:2px}
.chip.on{background:#FF6B00}
.order{border:1px solid #333;border-radius:14px;padding:12px;margin-bottom:8px;background:#1A1A1A;font-size:13px}
</style>
</head>
<body>
<div class="top"><div class="logo"><i>•</i>VTC</div><div style="display:flex;gap:14px;font-size:20px"><span onclick="bukaWarna()">🎨</span><span onclick="bukaAuth()">👤</span></div></div>

<div style="display:flex;justify-content:space-between;padding:6px 16px"><h3>Produk Hari Ini</h3><a href="#" onclick="tampilSemua();return false" style="color:#FF6B00">Lihat Semua ›</a></div>
<div class="grid" id="grid"></div>
